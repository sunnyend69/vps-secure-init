[project]
name = "vps-secure-init"
version = "0.1.4"
description = "Interactive VPS security initialization controller for macOS"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pexpect>=4.9"]

[project.scripts]
vpsctl = "vps_secure_init.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
